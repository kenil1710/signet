<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signet Demo dApp</title>
    <script>window.__demoBoot = Date.now();</script>
  </head>
  <body>
    <main id="app">
      <h1>Demo Swap</h1>
      <p class="sub">A small X Layer swap and stake page, used to show what Signet Guard does.</p>
      <p><button id="connect">Connect wallet</button> <span id="account">not connected</span></p>
      <section>
        <h2>Swap 10 USDT for OKB</h2>
        <button id="approve">1. Approve USDT</button>
        <button id="swap">2. Swap</button>
        <button id="permit">or sign a Permit2 approval</button>
      </section>
      <section>
        <h2>Stake</h2>
        <button id="stake">Stake 5 USDT</button>
      </section>
      <p id="status" data-state="idle">Ready.</p>
      <p id="net" class="sub"></p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
