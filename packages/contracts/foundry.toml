[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
remappings = ["forge-std/=lib/forge-std/src/"]
fs_permissions = [{ access = "read", path = "./spike-data" }, { access = "read", path = "../circuit/artifacts" }]

[rpc_endpoints]
xlayer = "${XLAYER_RPC_URL}"

# See https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
